# A fungible pool of MockRobotAdapter workers -- all genuinely
# interchangeable (same OEM type, same capabilities), which is exactly
# the condition under which K8s replica scaling makes sense (see
# README.md's "Run it with Docker" K8s section for why heterogeneous
# robots themselves aren't modeled as replicas, only same-type pools
# are). fleet_scaler.py adjusts `replicas` below at runtime.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mockrobot-pool
  namespace: iac-fleet
  labels:
    app: mockrobot-pool
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mockrobot-pool
  template:
    metadata:
      labels:
        app: mockrobot-pool
        iac/role: fleet-worker
    spec:
      containers:
        - name: worker
          image: iac-robot-integration:local
          imagePullPolicy: Never
          command: ["python", "fleet_worker/app.py"]
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: ROBOT_TYPE
              value: mockrobot
            - name: MOCK_PAYLOAD
              value: visual_camera,thermal_camera
            - name: WORKER_PORT
              value: "6000"
            - name: ROBOT_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - containerPort: 6000
          readinessProbe:
            httpGet: { path: /health, port: 6000 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 6000 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mockrobot-pool
  namespace: iac-fleet
spec:
  clusterIP: None # headless -- fleet_discovery.py reads individual pod IPs via the Pods API, not this VIP
  selector:
    app: mockrobot-pool
  ports:
    - port: 6000
      targetPort: 6000
